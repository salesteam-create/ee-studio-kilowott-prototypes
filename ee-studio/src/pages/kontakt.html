<!-- key: kontakt | title: Ta kontakt | desc: Ta kontakt med EE Studio for design og fotografi. -->

<header class="wrap phead">
  <h1 class="t-xl" data-split>La oss ta en prat.</h1>
</header>
<section class="wrap contact">
  <div style="display:grid;gap:var(--s-2);align-content:start">
    <p class="prose">Fortell kort hva du trenger, så svarer jeg innen to virkedager.</p>
    <a class="t-md link" href="mailto:elisabet@eestudio.no">elisabet@eestudio.no</a>
    <a class="t-md link" href="tel:+4748117215">+47 48 11 72 15</a>
  </div>
  <form class="form" data-form novalidate>
    <div class="field"><span class="label">Hva gjelder det?</span>
      <div class="choices" style="margin-top:.6rem">
        <label class="choice"><input type="radio" name="tema" value="design"><span>Design</span></label>
        <label class="choice"><input type="radio" name="tema" value="foto"><span>Foto</span></label>
        <label class="choice"><input type="radio" name="tema" value="begge" checked><span>Begge</span></label>
      </div>
    </div>
    <div class="row2">
      <div class="field"><label for="navn">Navn</label><input id="navn" name="navn" required autocomplete="name"></div>
      <div class="field"><label for="epost">E-post</label><input id="epost" name="epost" type="email" required autocomplete="email"></div>
    </div>
    <div class="field"><label for="melding">Om prosjektet</label><textarea id="melding" name="melding" required></textarea></div>
    <div><button class="pill pill--fill" type="submit">Send <span class="arrow" aria-hidden="true"></span></button></div>
    <div class="form__ok" role="status"><p class="t-lg">Takk. Jeg svarer innen to virkedager.</p></div>
  </form>
</section>
